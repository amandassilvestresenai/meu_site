<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
     <header class="cabecalho"><!--Cabealho do site-->
        <div class="logo">CineSENAI</div>
        <nav class="Menu"><!--Menu de navegação-->
            <a href="index.html">Em Cartaz</a>
            <a href="em_breve.html" target="_blank">Em Breve</a>
            <a href="precos.html" target="_blank">Precos</a>
            <a href="contato.html" target="_blank">Contato</a>
            <a href="cardapio.html" target="_blank">Cardápio</a>
        </nav>
    </header>
    <main class="container">
        <h1 class="titulo-secao">Cadastro para dicas de Filmes</h1>
        <p class="subtitulo">Preencha seus dados para realizar a inscrição no CineSENAI</p>
        <div class="area-inscricao">
            <form action="/processar-cadastro" method="post" class="coluna-form">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="3" maxlength="50"> <br><br>

                <label for="senha">Senha de acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="8" maxlength="20"><br><br>
                
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com"><br><br>

                <label for="data-nascimento">Data de Nascimeto</label>
                <input type="date" id="data-nascimento" name="data-nacimento" min="1900-01-01" max="2026-12-31" required><br><br>

                <label>Período dos Filmes</label><br>
                <input type="radio" id="turno_manha" name="turno" value="manha" required>
                <label for="turno_manha">Manhã</label>

                <input type="radio" id="turno_tarde" name="turno" value="tarde">
                <label for="turno_tarde">Tarde</label>

                <input type="radio" id="turno_noite" name="turno" value="noite">
                <label for="turno_noite">Noite</label><br><br>

                <label>Filmes de Interesse</label><br>
                <input type="checkbox" id="acao" name="interesse" value="acao">
                <label for="acao">Filmes de Ação</label>

                <input type="checkbox" id="comedia" name="interesse" value="comedia">
                <label for="comedia">Filmes de Comédia</label>

                <input type="checkbox" id="terror" name="interesse" value="terror">
                <label for="terror">Filmes de Terror</label><br><br>

                <label for="unidade">Selecione o Cinema</label>
                <select name="unidade" id="unidade" required>
                    <option value="" disa selected>Selecione um Cinema</option>
                    <option value="sp">São Paulo-Capital</option>
                    <option value="sebastianopolis">Sebastianópolis do Sul</option>
                    <option value="votuporanga">Votuporanga</option>
                    <option value="valentim">Valentim Gentil</option>
                </select><br><br>

                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Li e Aceito os Termos</label>

                <button type="submit" class="btn-limpar">Limpar Tudo</button>
                <button type="reset" class="btn-enviar">Enviar</button><br><br>

            </form>

            <div class="coluna-midia">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d91000.05824643128!2d-50.04631155403773!3d-20.655916189788172!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bd7b4b248f03a1%3A0xb8ed21a313f879da!2sSebastianopolis%20do%20Sul!5e1!3m2!1spt-BR!2sbr!4v1787665718589!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/Y-yWXimyorQ?si=XH0vSgKmdFGIFewB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            </div>

        </div>
    </main>
</body>
</html>
